<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HemaCDS 2.0_Multiple myeloma - Demographics and Disease-related characteristics</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=4">
    <style>
        .custom-text-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.225rem 0.8rem;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }
        .custom-text-input:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(255, 255, 255, 0.08);
        }
        .radio-group-vertical {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 1rem;
        }
        .radio-group-vertical label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-main, #e2e8f0);
        }
        .radio-group-vertical input[type="radio"] {
            transform: scale(1.2);
            cursor: pointer;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <h1 style="font-size: 1.5rem;">HemaCDS 2.0_<span>Multiple myeloma</span></h1>
            </div>
        </header>

        <main class="app-main">
            <section class="content-area" id="content-area">
                <div class="cycle-planner" id="planner-container" style="margin: 0; max-width: 900px;">
                    
                    <div class="planner-header">
                        <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                            <h2 style="font-size: 1.5rem; font-weight: 500; color: var(--text-light, #f8fafc);">Demographics and Disease-related characteristics</h2>
                        </div>
                    </div>

                    <div class="planner-sections">
                        <!-- Section 1: Disease Phase -->
                        <div class="card">
                            <div class="card-header">
                                <h3 style="margin: 0;">1. Disease phase</h3>
                            </div>
                            <div class="card-body" style="display: flex; gap: 4rem; align-items: flex-start; flex-wrap: wrap;">
                                <div class="radio-group-vertical" style="flex: 1; min-width: 280px; max-width: 400px;">
                                    <div style="display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start;">
                                        <label style="margin: 0;">
                                            <input type="radio" name="disease-phase" value="mgus" onchange="toggleOthersInput()">
                                            Monoclonal gammopathy of clinical significance
                                        </label>
                                        <div id="mgcs-dropdown-container" style="display: none; margin-left: 1.8rem; flex-wrap: wrap; gap: 0.5rem; align-items: center;">
                                            <select id="mgcs-type-select" class="custom-text-input" style="width: 120px; cursor: pointer; transform: translateY(-6px);" onchange="toggleMgcsOthersInput()">
                                                <option value="renal" style="color: #000;" selected>Renal</option>
                                                <option value="nervous" style="color: #000;">Nervous</option>
                                                <option value="cutaneous" style="color: #000;">Cutaneous</option>
                                                <option value="ocular" style="color: #000;">Ocular</option>
                                                <option value="others" style="color: #000;">Others</option>
                                            </select>
                                            <input type="text" id="mgcs-others-input" class="custom-text-input" placeholder="Please specify..." style="display: none; width: 120px; transform: translateY(-6px);">
                                        </div>
                                    </div>
                                    <label>
                                        <input type="radio" name="disease-phase" value="smoldering" onchange="toggleOthersInput()">
                                        Smoldering myeloma
                                    </label>
                                    <label>
                                        <input type="radio" name="disease-phase" value="symptomatic" onchange="toggleOthersInput()">
                                        Symptomatic myeloma
                                    </label>
                                    <label>
                                        <input type="radio" name="disease-phase" value="plasma_cell_leukemia" onchange="toggleOthersInput()">
                                        Plasma cell leukemia
                                    </label>
                                    <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                                        <label style="margin: 0;">
                                            <input type="radio" name="disease-phase" value="others" onchange="toggleOthersInput()">
                                            Others
                                        </label>
                                        <input type="text" id="disease-phase-others-input" class="custom-text-input" placeholder="Please specify..." style="display: none; width: 200px; margin-left: 0.5rem; transform: translateY(-6px);">
                                    </div>
                                </div>
                                <div class="amyloidosis-section" style="flex: 1; min-width: 300px;">
                                    <div style="display: flex; align-items: center; gap: 1rem; transform: translateY(-10px);">
                                        <label for="amyloidosis-select" style="font-size: 1rem; color: var(--text-main, #e2e8f0); margin: 0; white-space: nowrap;">Concurrent amyloidosis</label>
                                        <select id="amyloidosis-select" class="custom-text-input" style="width: 120px; cursor: pointer; transform: translateY(-4px);" onchange="toggleAmyloidosisDetails()">
                                            <option value="yes" style="color: #000;">Yes</option>
                                            <option value="no" style="color: #000;" selected>No</option>
                                        </select>
                                    </div>
                                    
                                    <div id="amyloidosis-details" style="display: none; margin-top: 1rem;">
                                        <div style="display: flex; flex-direction: column; gap: 0.8rem;">
                                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-main, #e2e8f0);">
                                                <input type="checkbox" name="amyloidosis-type" value="renal" style="transform: scale(1.1); margin: 0; cursor: pointer;"> Renal
                                            </label>
                                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-main, #e2e8f0);">
                                                <input type="checkbox" name="amyloidosis-type" value="cardiac" style="transform: scale(1.1); margin: 0; cursor: pointer;"> Cardiac
                                            </label>
                                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-main, #e2e8f0);">
                                                <input type="checkbox" name="amyloidosis-type" value="neurologic" style="transform: scale(1.1); margin: 0; cursor: pointer;"> Neurologic
                                            </label>
                                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-main, #e2e8f0);">
                                                <input type="checkbox" name="amyloidosis-type" value="hepatic" style="transform: scale(1.1); margin: 0; cursor: pointer;"> Hepatic
                                            </label>
                                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-main, #e2e8f0);">
                                                <input type="checkbox" name="amyloidosis-type" value="gi" style="transform: scale(1.1); margin: 0; cursor: pointer;"> GI
                                            </label>
                                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-main, #e2e8f0);">
                                                <input type="checkbox" name="amyloidosis-type" value="soft_tissue" style="transform: scale(1.1); margin: 0; cursor: pointer;"> Soft tissue
                                            </label>
                                            <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                                                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-main, #e2e8f0); margin: 0;">
                                                    <input type="checkbox" name="amyloidosis-type" value="other" id="amyloidosis-other-cb" onchange="toggleAmyloidosisOther()" style="transform: scale(1.1); margin: 0; cursor: pointer;"> Other
                                                </label>
                                                <input type="text" id="amyloidosis-other-input" class="custom-text-input" placeholder="Please specify..." style="display: none; width: 120px; margin-left: 0.5rem; transform: translateY(-6px);">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div style="display: flex; justify-content: flex-end; margin-top: -0.375rem; margin-bottom: 1rem;">
                            <button id="submit-btn" class="btn-primary" style="padding: 0.4rem 2rem; font-size: 0.875rem; font-weight: 600; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">Submit</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        function toggleOthersInput() {
            const othersRadio = document.querySelector('input[name="disease-phase"][value="others"]');
            const othersInput = document.getElementById('disease-phase-others-input');
            if (othersRadio && othersRadio.checked) {
                othersInput.style.display = 'inline-block';
                othersInput.focus();
            } else {
                if (othersInput) {
                    othersInput.style.display = 'none';
                    othersInput.value = '';
                }
            }

            const mgcsRadio = document.querySelector('input[name="disease-phase"][value="mgus"]');
            const mgcsDropdown = document.getElementById('mgcs-dropdown-container');
            if (mgcsRadio && mgcsRadio.checked) {
                mgcsDropdown.style.display = 'flex';
            } else {
                if (mgcsDropdown) {
                    mgcsDropdown.style.display = 'none';
                    document.getElementById('mgcs-type-select').value = "renal";
                    const mgcsOthersInput = document.getElementById('mgcs-others-input');
                    if (mgcsOthersInput) {
                        mgcsOthersInput.style.display = 'none';
                        mgcsOthersInput.value = '';
                    }
                }
            }
        }

        function toggleMgcsOthersInput() {
            const select = document.getElementById('mgcs-type-select');
            const input = document.getElementById('mgcs-others-input');
            if (select && select.value === 'others') {
                input.style.display = 'inline-block';
                input.focus();
            } else {
                if (input) {
                    input.style.display = 'none';
                    input.value = '';
                }
            }
        }

        function toggleAmyloidosisDetails() {
            const select = document.getElementById('amyloidosis-select');
            const details = document.getElementById('amyloidosis-details');
            if (select.value === 'yes') {
                details.style.display = 'block';
            } else {
                details.style.display = 'none';
            }
        }

        function toggleAmyloidosisOther() {
            const cb = document.getElementById('amyloidosis-other-cb');
            const input = document.getElementById('amyloidosis-other-input');
            if (cb && cb.checked) {
                input.style.display = 'inline-block';
                input.focus();
            } else {
                if (input) {
                    input.style.display = 'none';
                    input.value = '';
                }
            }
        }
    </script>
</body>
</html>
