<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HemaCDS 2.0 Multiple myeloma_BM aspiration and biopsy</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3">
    <style>
        .radio-group-horizontal {
            display: flex;
            gap: 2rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .radio-group-horizontal label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-main);
        }

        .input-percent-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .input-percent-wrapper::after {
            content: '%';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(calc(-50% + 5px)); /* 숫자가 약간 아래에 위치하는 것을 보정 */
            color: #94a3b8;
            pointer-events: none;
            font-size: 1rem;
        }

        /* 숫자 입력창 스피너 숨기기 */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <h1 style="font-size: 1.5rem;">HemaCDS 2.0 <span>Multiple myeloma_BM aspiration and biopsy</span></h1>
            </div>
        </header>

        <main class="app-main">
            <!-- content-area fills the space (no right scrollbar glitch), aligned left -->
            <section class="content-area" id="content-area">
                <div class="cycle-planner" id="planner-container" style="margin: 0; max-width: 900px;">
                    
                    <div class="planner-header">
                        <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                            <h2>BM Aspiration and Biopsy</h2>
                            <div class="cycle-meta-inputs" style="display: flex; gap: 1rem; align-items: center;">
                                <div style="display: flex; align-items: center; gap: 0.5rem;">
                                    <label for="date-of-test" style="font-size: 0.875rem; color: var(--text-secondary);">Date of test</label>
                                    <input type="date" data-date="" id="date-of-test" class="custom-text-input custom-date-format" style="margin: 0; padding: 0.4rem; width: 118px; font-size: 0.875rem; text-align: center;">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="planner-sections">
                        <!-- Section 1: Sample type -->
                        <div class="card">
                            <div class="card-header">
                                <h3>1. Sample type</h3>
                                <p class="subtitle">Select the sample type</p>
                            </div>
                            <div class="card-body">
                                <div class="radio-group-horizontal">
                                    <label>
                                        <input type="radio" name="sample-type" value="Bone marrow aspirate">
                                        Bone marrow aspirate
                                    </label>
                                    <label>
                                        <input type="radio" name="sample-type" value="Bone marrow biopsy">
                                        Bone marrow biopsy
                                    </label>
                                    <label>
                                        <input type="radio" name="sample-type" value="Both" checked>
                                        Both
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Section 2: Cellularity and Percentage of Plasma cells -->
                        <div class="card">
                            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h3>2. Cellularity and Percentage of Plasma cells</h3>
                                    <p class="subtitle">Enter percentages</p>
                                </div>
                                <button id="add-ihc-btn" class="btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.875rem;">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="12" y1="5" x2="12" y2="19"></line>
                                        <line x1="5" y1="12" x2="19" y2="12"></line>
                                    </svg>
                                    Add IHC Result
                                </button>
                            </div>
                            <div class="card-body">
                                <div id="ihc-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem 2rem;">
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="cellularity" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Cellularity</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="cellularity" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="plasma-cell" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Plasma cell</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="plasma-cell" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="cd138" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">CD138 (IHC)</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="cd138" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Section 3: Interpretation -->
                        <div class="card">
                            <div class="card-header">
                                <h3>3. Interpretation</h3>
                                <p class="subtitle">Enter the clinical interpretation</p>
                            </div>
                            <div class="card-body">
                                <textarea id="interpretation" class="custom-text-input custom-date-format" placeholder="Enter interpretation here..." style="width: 100%; max-width: 600px; min-height: 80px; resize: vertical; padding: 1rem;"></textarea>
                            </div>
                        </div>

                        <!-- Section 4: Differential Count -->
                        <div class="card">
                            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h3>4. Differential Count</h3>
                                    <p class="subtitle">Enter differential count details</p>
                                </div>
                                <button id="add-diff-btn" class="btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.875rem;">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="12" y1="5" x2="12" y2="19"></line>
                                        <line x1="5" y1="12" x2="19" y2="12"></line>
                                    </svg>
                                    Add Cell Type
                                </button>
                            </div>
                            <div class="card-body">
                                <div id="diff-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem 2rem;">
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="seg-neutrophil" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Segmented neutrophil</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="seg-neutrophil" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="band-neutrophil" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Band neutrophil</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="band-neutrophil" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="myelocyte" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Myelocyte</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="myelocyte" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="metamyelocyte" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Metamyelocyte</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="metamyelocyte" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="eosinophil" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Eosinophil</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="eosinophil" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="basophil" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Basophil</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="basophil" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="lymphocyte" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Lymphocyte</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="lymphocyte" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="monocyte" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Monocyte</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="monocyte" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="promyelocyte" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Promyelocyte</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="promyelocyte" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="diff-plasma-cell" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Plasma cell</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="diff-plasma-cell" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="histiocyte" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Histiocyte</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="histiocyte" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="erythrocyte" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Erythrocyte</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="erythrocyte" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="megakaryocyte" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Megakaryocyte</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="megakaryocyte" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <label for="blast" style="width: 160px; font-weight: 500; color: var(--text-main); transform: translateY(4px);">Blast</label>
                                        <div class="input-percent-wrapper">
                                            <input type="number" id="blast" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div style="display: flex; justify-content: flex-end; margin-top: 2rem; margin-bottom: 1rem;">
                        <button id="submit-btn" class="btn-primary" style="padding: 0.4rem 2rem; font-size: 0.875rem; font-weight: 600; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">Submit</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('date-of-test');
            if (dateInput) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.value = today;
            }

            // Add dynamic differential count item
            const addDiffBtn = document.getElementById('add-diff-btn');
            const diffGrid = document.getElementById('diff-grid');

            if (addDiffBtn && diffGrid) {
                addDiffBtn.addEventListener('click', () => {
                    const div = document.createElement('div');
                    div.style.cssText = 'display: flex; align-items: center; gap: 0.5rem;';
                    div.innerHTML = `
                        <input type="text" class="custom-text-input" value="Others" placeholder="Others" style="width: 160px; padding: 0.5rem;">
                        <div class="input-percent-wrapper">
                            <input type="number" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                        </div>
                        <button class="btn-icon" onclick="this.parentElement.remove()" style="color: var(--danger); margin-top: 0.75rem;" title="Remove">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    `;
                    diffGrid.appendChild(div);
                });
            }

            // Add dynamic IHC item
            const addIhcBtn = document.getElementById('add-ihc-btn');
            const ihcContainer = document.getElementById('ihc-container');

            if (addIhcBtn && ihcContainer) {
                addIhcBtn.addEventListener('click', () => {
                    const div = document.createElement('div');
                    div.style.cssText = 'display: flex; align-items: center; gap: 0.5rem;';
                    div.innerHTML = `
                        <input type="text" class="custom-text-input" value="Others" placeholder="Others" style="width: 160px; padding: 0.5rem;">
                        <div class="input-percent-wrapper">
                            <input type="number" class="custom-text-input" min="0" max="100" step="0.1" placeholder="0.0" style="width: 100px; padding: 0.5rem; padding-right: 30px; text-align: right;">
                        </div>
                        <button class="btn-icon" onclick="this.parentElement.remove()" style="color: var(--danger); margin-top: 0.75rem;" title="Remove">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    `;
                    ihcContainer.appendChild(div);
                });
            }

            // Submit logic
            const submitBtn = document.getElementById('submit-btn');
            if (submitBtn) {
                submitBtn.addEventListener('click', () => {
                    const dateInputObj = document.getElementById('date-of-test');
                    const testDate = dateInputObj ? dateInputObj.value : '';
                    const pcInputObj = document.getElementById('diff-plasma-cell');
                    const plasmaCell = pcInputObj ? pcInputObj.value : '';
                    
                    if (window.opener && !window.opener.closed) {
                        window.opener.postMessage({
                            type: 'BM_ASPIRATION_DATA',
                            date: testDate,
                            plasmaCell: plasmaCell
                        }, '*');
                    }
                    window.close();
                });
            }
        });
    </script>
</body>

</html>
