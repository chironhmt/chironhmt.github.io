<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eunpyeong St. Mary's Myeloma Center Database</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3">
    <style>
        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glass);
            background: rgba(0, 0, 0, 0.2);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: center;
            color: var(--text-primary);
        }

        .data-table th, .data-table td {
            padding: 0.8rem 0.5rem;
            border-bottom: 1px solid var(--border-glass);
            white-space: nowrap;
        }

        .data-table th {
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .data-table tbody tr {
            transition: background var(--transition-fast);
        }

        .data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .data-table tbody tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-alive {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-deceased {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--accent-secondary);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color var(--transition-fast);
        }

        .action-btn:hover {
            color: #fff;
            text-decoration: underline;
        }

        .search-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-bar {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-bar input {
            padding-left: 2.5rem;
        }

        .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <h1>Eunpyeong St. Mary's Myeloma Center Database</h1>
            </div>
        </header>

        <main class="app-main">
            <section class="content-area" id="content-area">
                <div class="cycle-planner" id="planner-container" style="margin: 0; max-width: 900px;">
                    
                    <div class="planner-header">
                        <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                            <h2>Dashboard</h2>
                        </div>
                    </div>

                    <div class="planner-sections">
                        <div class="card">
                            <div class="card-body">
                                
                                <div class="search-container">
                                    <div class="search-bar">
                                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="11" cy="11" r="8"></circle>
                                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                        </svg>
                                        <input type="text" id="search-input" class="custom-text-input" placeholder="Search by ID or Name..." style="margin: 0; max-width: none; padding-top: 0.5rem; padding-bottom: 0.5rem;" onkeyup="filterPatients()">
                                    </div>
                                    <button class="btn-primary" onclick="window.location.href='Eunpyeong_Multiple Myeloma.html'" style="padding: 0.5rem 1.1rem; border-radius: 8px;">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <line x1="12" y1="5" x2="12" y2="19"></line>
                                            <line x1="5" y1="12" x2="19" y2="12"></line>
                                        </svg>
                                        Add New Patient
                                    </button>
                                </div>

                                <div class="table-container">
                                    <table class="data-table" id="patients-table">
                                        <thead>
                                            <tr>
                                                <th>Patient ID</th>
                                                <th>Name</th>
                                                <th>Age / Sex</th>
                                                <th>Diagnosis Date</th>
                                                <th>Vital Status</th>
                                                <th>Last Follow-up</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="patients-tbody">
                                            <!-- Rows will be populated by JS -->
                                        </tbody>
                                    </table>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        let allPatients = [];
        
        const mockPatients = [
            {
                patient_id: "10023456",
                patient_name: "Kim Chul Soo",
                age_at_diagnosis: 65,
                sex: "Male",
                diagnosis_date: "2023-01-15",
                vital_status: "Alive",
                last_followup_date: "2024-05-20"
            },
            {
                patient_id: "10087654",
                patient_name: "Lee Young Hee",
                age_at_diagnosis: 72,
                sex: "Female",
                diagnosis_date: "2022-11-05",
                vital_status: "Alive",
                last_followup_date: "2024-06-10"
            },
            {
                patient_id: "10045678",
                patient_name: "Park Ji Sung",
                age_at_diagnosis: 58,
                sex: "Male",
                diagnosis_date: "2021-08-22",
                vital_status: "Deceased",
                last_followup_date: "2023-12-01"
            },
            {
                patient_id: "10099887",
                patient_name: "Choi Min Sik",
                age_at_diagnosis: 69,
                sex: "Male",
                diagnosis_date: "2024-02-10",
                vital_status: "Alive",
                last_followup_date: "2024-06-25"
            }
        ];

        function renderPatients(data) {
            const tbody = document.getElementById('patients-tbody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 2rem;">No patients found.</td></tr>';
                return;
            }

            data.forEach(p => {
                const tr = document.createElement('tr');
                
                const statusClass = p.vital_status === 'Alive' ? 'status-alive' : 'status-deceased';

                tr.innerHTML = `
                    <td style="font-weight: 500;">${p.patient_id}</td>
                    <td>${p.patient_name}</td>
                    <td>${p.age_at_diagnosis || '-'} / ${p.sex ? p.sex.charAt(0) : '-'}</td>
                    <td>${p.diagnosis_date || '-'}</td>
                    <td><span class="status-badge ${statusClass}">${p.vital_status || '-'}</span></td>
                    <td style="color: var(--text-muted);">${p.last_followup_date || '-'}</td>
                    <td>
                        <button class="action-btn" onclick="viewDetails('${p.patient_id}')">View / Edit</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterPatients() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allPatients.filter(p => 
                (p.patient_id && p.patient_id.toLowerCase().includes(query)) || 
                (p.patient_name && p.patient_name.toLowerCase().includes(query))
            );
            renderPatients(filtered);
        }

        function viewDetails(patientId) {
            window.location.href = 'Eunpyeong_Multiple Myeloma.html';
        }

        // Initialize table
        document.addEventListener('DOMContentLoaded', () => {
            // Fetch from local Python server
            fetch('http://127.0.0.1:5000/api/patients')
                .then(res => {
                    if (!res.ok) throw new Error('Network response was not ok');
                    return res.json();
                })
                .then(data => {
                    allPatients = data.length > 0 ? data : mockPatients; // Use mock if DB is empty for demo
                    renderPatients(allPatients);
                })
                .catch(err => {
                    console.warn("Could not fetch from server, falling back to mock data.", err);
                    allPatients = mockPatients;
                    renderPatients(allPatients);
                });
        });

    </script>
</body>
</html>
